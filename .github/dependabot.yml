version: 2
updates:
  # GitHub Actions versions (including Raftersecurity/rafter-cli), grouped weekly.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  # npm dependencies in both the extension root and the docs site, grouped weekly.
  - package-ecosystem: npm
    directories:
      - "/"
      - "/site"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"
