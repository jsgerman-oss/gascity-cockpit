name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: typecheck · lint · coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Runs typecheck + lint + vitest with v8 coverage; the coverage
      # thresholds (95/90/95/95) in vitest.config.ts fail the job on a regression.
      - run: npm run check
