<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Set theme before first paint to avoid a flash. Dark is the primary theme.
			(function () {
				try {
					var override = new URLSearchParams(location.search).get('theme');
					var stored = localStorage.getItem('cockpit-theme');
					var pref = override === 'light' || override === 'dark' ? override : stored;
					var dark = pref ? pref === 'dark' : true;
					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.classList.toggle('light', !dark);
					document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
				} catch (e) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
